services:
  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    volumes:
      # Replaces nginx's default server block: proxies /api to the backend so
      # the frontend's relative fetch() calls resolve to FastAPI.
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:${POSTGRES_PORT}/${POSTGRES_DB}
      # Only takes effect if watchfiles is installed (uvicorn[standard]); the
      # current requirements.txt has plain uvicorn, so the reloader falls back
      # to StatReload, which already polls and works over Windows bind mounts.
      # Kept so reloading keeps working if watchfiles is added later.
      - WATCHFILES_FORCE_POLLING=true
      # Set to false to skip the Ollama warm-up on startup, which --reload
      # otherwise re-runs on every code change.
      - AI_WARMUP=true
      # Signs the session cookie. Falls back to a known dev value so the
      # stack runs out of the box; override in .env before deploying.
      - SESSION_SECRET=${SESSION_SECRET:-dev-only-insecure-session-secret}
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
      ollama-init:
        condition: service_completed_successfully
      asr:
        condition: service_started
    volumes:
      - ./backend:/app/backend
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"

  db:
    image: postgres:15
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Bound to localhost so the database is not reachable from other machines
      # on the network, regardless of firewall configuration.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      # Localhost only: the pgAdmin login is a well-known default.
      - "127.0.0.1:5050:80"
    depends_on:
      db:
        condition: service_healthy

  ollama:
    image: ollama/ollama:0.33.0
    container_name: ollama
    ports:
      - "11434:11434"
    environment:
      OLLAMA_LLM_LIBRARY: cpu_avx2
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    # GPU CONFIG MOVED TO docker-compose.override.yml

  ollama-init:
    image: ollama/ollama:0.33.0
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5-coder:latest}
    entrypoint:
      - /bin/sh
      - -c
    command:
    - |
      echo "Checking Ollama model: $$OLLAMA_MODEL"

      if ollama show "$$OLLAMA_MODEL" > /dev/null 2>&1; then
        echo "Ollama model already installed: $$OLLAMA_MODEL"
      else
        echo "Ollama model not found. Downloading..."
        ollama pull "$$OLLAMA_MODEL"
      fi

      echo "Ollama model ready."
    restart: "no"

  asr:
    build:
      context: .
      dockerfile: backend/asr/Dockerfile
    depends_on:
      asr-model-init:
        condition: service_completed_successfully
    container_name: asr
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      HF_HOME: /models/hf
      PYTHONWARNINGS: ignore::FutureWarning
    volumes:
      - asr_models:/models
      - ./backend/asr:/app/backend/asr
    # GPU CONFIG MOVED TO docker-compose.override.yml

  asr-model-init:
    image: alpine:3.20
    environment:
      ASR_DIR: /models
      ASR_DEFAULT_MODEL: ${ASR_DEFAULT_MODEL:-en-us}
    volumes:
      - asr_models:/models
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        set -e

        MODEL_DIR="$$ASR_DIR/$$ASR_DEFAULT_MODEL"

        echo "Checking Vosk model at $$MODEL_DIR"

        if [ -f "$$MODEL_DIR/conf/model.conf" ] && [ -d "$$MODEL_DIR/am" ]; then
          echo "Vosk model already installed."
          exit 0
        fi

        echo "Vosk model missing. Downloading..."

        apk add --no-cache curl unzip

        cd /tmp

        curl -fL \
          https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip \
          -o vosk-model.zip

        unzip -q vosk-model.zip

        rm -rf "$$MODEL_DIR"

        mkdir -p "$$ASR_DIR"

        mv vosk-model-small-en-us-0.15 "$$MODEL_DIR"

        echo "Vosk model installed at $$MODEL_DIR"
        echo "ASR model ready."
    restart: "no"

volumes:
  postgres_data:
  ollama:
  asr_models:
