name: CI Smoke Test

on:
  pull_request:
    branches:
      - dev
      - main

jobs:
  smoke-test:
    name: Stack smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Create .env from example
        run: |
          cp .env.example .env
          echo "SMALL_MODEL_NAME=qwen2.5:0.5b" >> .env

      - name: Start Ollama and pull small model
        run: |
          docker compose up -d ollama
          for i in $(seq 1 30); do
            if docker compose exec -T ollama ollama list >/dev/null 2>&1; then
              break
            fi
            echo "Waiting for Ollama... ($i)"
            sleep 2
          done
          docker compose exec -T ollama ollama pull qwen2.5:0.5b

      - name: Start the full stack
        run: docker compose up -d --build

      - name: Wait for backend /health
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health || true)
            if [ "$code" = "200" ]; then
              echo "Backend healthy."
              exit 0
            fi
            echo "Waiting for backend... ($i) [status=$code]"
            sleep 5
          done
          echo "Backend did not become healthy in time."
          exit 1

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
