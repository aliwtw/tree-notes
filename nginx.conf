server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Forward API traffic to FastAPI. No trailing slash on proxy_pass, so the
    # /api prefix is preserved and the backend sees /api/login, not /login.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI routes (/api/graph, /api/summary, graph search) block until Ollama
        # finishes generating, which on CPU can exceed nginx's 60s default and
        # surface as a 504 while the backend is still working.
        proxy_read_timeout 300s;
    }

    # React Router uses BrowserRouter, so /dashboard and /profile are client-side
    # routes with no file on disk. Serve index.html for anything unmatched or a
    # hard refresh on those paths returns 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /asr/ {
        proxy_pass http://asr:8000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         "upgrade";
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;

        # streaming mic audio sits open longer than nginx 60 sec default
        # read/send timeout especially through pauses in speech
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/graph/stream {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}